[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-core"
version = "0.1.0"
description = "A self-hosted, persistent multi-agent development worker for independent project workspaces."
readme = "docs/operations/opencode-core.md"
requires-python = ">=3.10"
license = { text = "License not yet assigned; see repository licensing notice." }
dependencies = []

[project.scripts]
opencode-core = "ai.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai", "ai.*"]
