<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>Star Defender · STREAMIOV</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--cyan:#42e8ff;--mint:#74ffd1;--violet:#9b86ff;--red:#ff6488}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1d3150,#080b12 65%);color:#f4f7ff;font:16px system-ui;display:grid;place-items:center;padding:12px}main{width:min(960px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.brand{font-weight:900;letter-spacing:.15em;color:var(--mint)}.stats{display:flex;gap:8px}.stat{padding:7px 12px;border:1px solid #34435f;border-radius:10px;background:#111a2b}.stat small{display:block;color:#aebbd0;font-size:10px}.stage{position:relative;border:1px solid #34435f;border-radius:18px;overflow:hidden;background:#070b16}canvas{display:block;width:100%;height:min(68vh,600px);min-height:300px;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;text-align:center;background:#080b12c9}.overlay[hidden]{display:none}.dialog{max-width:460px;padding:24px;border:1px solid #59648e;border-radius:18px;background:#111a2bf2}.dialog h1{font-size:clamp(28px,6vw,46px);margin:0 0 8px}.dialog p{color:#c2cde0;line-height:1.5}.action,.controls button{border:0;border-radius:999px;padding:13px 22px;background:linear-gradient(90deg,var(--cyan),var(--mint));color:#07121b;font-weight:900}.controls{display:flex;justify-content:center;gap:10px;margin:12px}.controls button{min-width:78px;border-radius:12px;touch-action:none}.hint{text-align:center;color:#aebbd0;font-size:12px}@media(min-width:720px){.controls{display:none}}
</style></head><body><main><header><div class="brand">STREAMIOV ♥ ARCADE</div><div class="stats"><div class="stat"><small>PUNKTE</small><strong id="score">0</strong></div><div class="stat"><small>LEBEN</small><strong id="lives">3</strong></div><div class="stat"><small>SEKTOR</small><strong id="level">1</strong></div></div></header><section class="stage"><canvas id="game" width="900" height="560" aria-label="Raumschiff steuern und Gegner abwehren"></canvas><div class="overlay" id="overlay"><div class="dialog"><h1>STAR DEFENDER</h1><p>Verteidige die Sternenroute. Steuere mit Tastatur oder Touch und schieße die Gegner ab.</p><button class="action" id="start">MISSION STARTEN</button></div></div></section><div class="controls"><button id="left">◀</button><button id="fire">FEUER</button><button id="right">▶</button></div><p class="hint">PC: A/D oder Pfeile bewegen · Leertaste feuern · Touch: ziehen und FEUER</p></main>
<script>(()=>{'use strict';const c=document.getElementById('game'),g=c.getContext('2d'),$=id=>document.getElementById(id),W=900,H=560;let run=false,score=0,lives=3,level=1,last=0,spawn=0,shot=0,raf=0,keys=new Set(),pointer=null,fireTouch=false,x=W/2,enemies=[],bullets=[],stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,s:.5+Math.random()*2}));function ui(){$('score').textContent=score;$('lives').textContent=lives;$('level').textContent=level}function reset(){score=0;lives=3;level=1;spawn=0;shot=0;x=W/2;enemies=[];bullets=[];ui()}function draw(){g.fillStyle='#070b16';g.fillRect(0,0,W,H);g.fillStyle='#8197ba';for(const s of stars){g.globalAlpha=.25;g.fillRect(s.x,s.y,s.s,s.s)}g.globalAlpha=1;g.save();g.translate(x,H-58);g.shadowBlur=22;g.shadowColor='#42e8ff';g.fillStyle='#42e8ff';g.beginPath();g.moveTo(0,-24);g.lineTo(21,18);g.lineTo(0,10);g.lineTo(-21,18);g.fill();g.restore();for(const b of bullets){g.fillStyle='#a9fff4';g.fillRect(b.x-3,b.y-10,6,18)}for(const e of enemies){g.fillStyle='#ff6488';g.shadowBlur=14;g.shadowColor='#ff6488';g.beginPath();g.moveTo(e.x,e.y-e.r);g.lineTo(e.x+e.r,e.y+e.r);g.lineTo(e.x-e.r,e.y+e.r);g.fill()}g.shadowBlur=0}function end(){run=false;cancelAnimationFrame(raf);$('overlay').hidden=false;$('overlay').querySelector('h1').textContent='MISSION BEENDET';$('overlay').querySelector('p').textContent='Punkte: '+score+'. Starte eine neue Mission.';$('start').textContent='NOCHMAL SPIELEN'}function tick(now){if(!run)return;const dt=Math.min((now-last)/1000,.04);last=now;for(const s of stars){s.y+=35*s.s*dt;if(s.y>H)s.y=0}if(keys.has('ArrowLeft')||keys.has('a')||keys.has('A')||keys.has('left'))x-=440*dt;if(keys.has('ArrowRight')||keys.has('d')||keys.has('D')||keys.has('right'))x+=440*dt;if(pointer!==null)x+=(pointer-x)*Math.min(1,dt*12);x=Math.max(22,Math.min(W-22,x));shot-=dt;if((keys.has(' ')||fireTouch)&&shot<=0){bullets.push({x,y:H-82,vy:-560});shot=.18}spawn-=dt;if(spawn<=0){enemies.push({x:25+Math.random()*(W-50),y:-20,r:14+Math.random()*8,vy:75+level*12});spawn=Math.max(.3,1.1-level*.06)}for(let i=bullets.length-1;i>=0;i--){bullets[i].y+=bullets[i].vy*dt;if(bullets[i].y<-20)bullets.splice(i,1)}for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];e.y+=e.vy*dt;if(e.y>H-35){enemies.splice(i,1);lives--;continue}for(let k=bullets.length-1;k>=0;k--){let b=bullets[k];if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+8){enemies.splice(i,1);bullets.splice(k,1);score+=10;break}}}level=Math.floor(score/120)+1;ui();draw();if(lives<=0){end();return}raf=requestAnimationFrame(tick)}function start(){cancelAnimationFrame(raf);reset();$('overlay').hidden=true;run=true;last=performance.now();raf=requestAnimationFrame(tick)}$('start').onclick=start;window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key)});window.addEventListener('keyup',e=>keys.delete(e.key));function aim(e){let r=c.getBoundingClientRect();pointer=(e.clientX-r.left)/r.width*W}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);aim(e)});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')aim(e)});c.addEventListener('pointerup',()=>pointer=null);c.addEventListener('pointercancel',()=>pointer=null);for(const [id,key] of [['left','left'],['right','right']]){$(id).onpointerdown=e=>{e.preventDefault();keys.add(key)};$(id).onpointerup=$(id).onpointercancel=$(id).onpointerleave=()=>keys.delete(key)}$('fire').onpointerdown=e=>{e.preventDefault();fireTouch=true};for(const ev of ['pointerup','pointercancel','pointerleave'])$('fire').addEventListener(ev,()=>fireTouch=false);reset();draw()})();</script></body></html>
