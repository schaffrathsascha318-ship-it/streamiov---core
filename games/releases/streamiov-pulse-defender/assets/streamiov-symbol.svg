<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Streamiov signal mark</title>
  <desc id="desc">A bright play mark held inside a flowing cyan and violet signal ring.</desc>
  <defs>
    <linearGradient id="bg" x1="18" y1="10" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111a31"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="signal" x1="24" y1="23" x2="103" y2="107" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b7bff"/>
      <stop offset=".48" stop-color="#42e8ff"/>
      <stop offset="1" stop-color="#74ffd1"/>
    </linearGradient>
    <linearGradient id="play" x1="51" y1="40" x2="86" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e6ffff"/>
      <stop offset="1" stop-color="#42e8ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="34" fill="url(#bg)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="33.25" fill="none" stroke="#a9bdff" stroke-opacity=".15" stroke-width="1.5"/>
  <path d="M91 32a43 43 0 0 0-59 8M37 96a43 43 0 0 0 59-8" fill="none" stroke="url(#signal)" stroke-linecap="round" stroke-width="7" filter="url(#glow)"/>
  <path d="M50 42.5c0-3.1 3.4-5 6.1-3.4l32.2 20.1a5.7 5.7 0 0 1 0 9.6L56.1 88.9c-2.7 1.7-6.1-.3-6.1-3.4V42.5Z" fill="url(#play)"/>
  <circle cx="94" cy="31" r="4" fill="#9a87ff"/>
  <circle cx="34" cy="97" r="4" fill="#67f4e4"/>
</svg>
