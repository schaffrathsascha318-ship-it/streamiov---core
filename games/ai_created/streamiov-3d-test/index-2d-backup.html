<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Streamiov 3D Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070914;color:#e9faff;font:15px system-ui;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;top:18px;left:18px;padding:16px 20px;background:#101326d9;border:1px solid #38e8ff66;border-radius:14px;box-shadow:0 0 28px #7c70ff22;pointer-events:none}
h1{font-size:19px;margin:0 0 6px;color:#54efff}p{margin:0;color:#c9c8ff;font-size:13px}
</style>
</head>
<body>
<div id="ui"><h1>STREAMIOV · 3D LAB</h1><p>Isolierter Grafiktest · WebGL-Prüfung</p><p id="status">Prüfe Grafikunterstützung …</p></div>
<canvas id="c"></canvas>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d');
let w,h,t=0,px=0,py=0;
function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
addEventListener('resize',resize);resize();
c.addEventListener('pointermove',e=>{px=(e.clientX/w-.5)*.5;py=(e.clientY/h-.5)*.35});
function line(a,b,col,lw=1){x.strokeStyle=col;x.lineWidth=lw;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}
function frame(){
 t+=.012;x.clearRect(0,0,w,h);
 let bg=x.createRadialGradient(w*.5,h*.48,5,w*.5,h*.48,Math.max(w,h)*.75);
 bg.addColorStop(0,'#171b3c');bg.addColorStop(1,'#050610');x.fillStyle=bg;x.fillRect(0,0,w,h);
 const cx=w*.5+px*100,cy=h*.49+py*80,scale=Math.min(w,h)*.27;
 // Perspective grid
 for(let i=-12;i<=12;i++){
  let bx=cx+i*scale/5,by=h*.76;
  line([cx+(bx-cx)*.12,h*.57],[bx, h*1.1],'#35dffb22');
 }
 for(let j=0;j<12;j++){
  let yy=h*.57+Math.pow(j/11,1.8)*h*.43;
  line([0,yy],[w,yy],'#7c70ff25');
 }
 // Rotating luminous wireframe 3D object
 let verts=[],N=8,rad=scale*.62;
 for(let i=0;i<N;i++){
  let a=i*Math.PI*2/N+t;
  verts.push([cx+Math.cos(a)*rad,cy+Math.sin(a)*rad*.72]);
 }
 x.shadowBlur=18;x.shadowColor='#38e8ff';
 for(let i=0;i<N;i++){
  line(verts[i],verts[(i+1)%N],'#44eaff',2);
  line(verts[i],[cx,cy],'#7c70ff99',1);
 }
 x.shadowBlur=0;
 // Inner core
 let g=x.createRadialGradient(cx,cy,2,cx,cy,rad*.6);
 g.addColorStop(0,'#f7ffff');g.addColorStop(.18,'#40eaff');g.addColorStop(1,'#7c70ff00');
 x.fillStyle=g;x.beginPath();x.arc(cx,cy,rad*.6,0,Math.PI*2);x.fill();
 x.strokeStyle='#b5faff';x.lineWidth=2;x.beginPath();x.arc(cx,cy,rad*.28,0,Math.PI*2);x.stroke();
 // Orbit ring
 x.save();x.translate(cx,cy);x.rotate(-.25+Math.sin(t*.4)*.15);
 x.strokeStyle='#a17cff';x.lineWidth=2;x.shadowBlur=14;x.shadowColor='#7c70ff';
 x.beginPath();x.ellipse(0,0,rad*1.35,rad*.38,0,0,Math.PI*2);x.stroke();x.restore();x.shadowBlur=0;
 requestAnimationFrame(frame);
}
frame();
</script>
<script>
const status=document.getElementById('status');
const test=document.createElement('canvas');
const gl=test.getContext('webgl2')||test.getContext('webgl');
status.textContent=gl?'WebGL verfügbar: '+(gl instanceof WebGL2RenderingContext?'WebGL 2':'WebGL 1'):'WebGL nicht verfügbar';
</script>
</body>
</html>
