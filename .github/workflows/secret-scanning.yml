name: Secret scanning

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-working-tree:
    name: Scan tracked working tree for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Scan current source tree with Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/path" \
            zricethezav/gitleaks:v8.24.2 \
            dir /path --redact --exit-code 1
