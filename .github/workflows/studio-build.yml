name: Streamiov Studio Builds

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Nach erfolgreichen Builds einen Release veröffentlichen"
        required: true
        type: boolean
        default: false
      release_version:
        description: "Release-Version ohne studio-v-Präfix"
        required: true
        type: string
        default: "1.0.1"
      prerelease:
        description: "Als Vorabversion kennzeichnen"
        required: true
        type: boolean
        default: true
  pull_request:
    paths:
      - "dist/streamiov-studio-app/**"
      - "scripts/sync-studio-ui.py"
      - ".github/workflows/studio-build.yml"
  push:
    paths:
      - "dist/streamiov-studio-app/**"
      - "scripts/sync-studio-ui.py"
      - ".github/workflows/studio-build.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            command: dist:win
          - name: Windows ARM64
            runner: windows-latest
            command: dist:win:arm64
          - name: Linux x64
            runner: ubuntu-latest
            command: dist:linux
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            command: dist:linux:arm64

    defaults:
      run:
        working-directory: dist/streamiov-studio-app

    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dist/streamiov-studio-app/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Eigene Regie-Engine testen
        run: npm run test:engine

      - name: Studio bauen
        run: npm run ${{ matrix.command }}

      - name: Installer als Artefakte speichern
        uses: actions/upload-artifact@v4
        with:
          name: streamiov-studio-${{ matrix.name }}
          path: dist/streamiov-studio-app/release/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.ref == 'refs/heads/streamiov-build-setup-clean' && github.event_name == 'workflow_dispatch' && inputs.publish_release
    name: Installer dauerhaft veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Installer aller Plattformen herunterladen
        uses: actions/download-artifact@v4
        with:
          pattern: streamiov-studio-*
          path: release
          merge-multiple: true

      - name: Prüfsummen erzeugen
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: GitHub Release erstellen oder aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-v${{ inputs.release_version }}
          name: Streamiov Studio ${{ inputs.release_version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.prerelease && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: release/*
