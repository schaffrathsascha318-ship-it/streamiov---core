name: Streamiov Studio Builds (native installers)

# Release 1.0.4: Windows x64/ARM64, Linux x64/ARM64 and ChromeOS Crostini DEB installers are built independently.
# Verified releases publish automatically from main after every required platform build and test succeeds.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Nach erfolgreichen Builds einen Release veröffentlichen"
        required: true
        type: boolean
        default: false
      release_version:
        description: "Release-Version ohne studio-v-Präfix"
        required: true
        type: string
        default: "1.0.4"
      prerelease:
        description: "Als Vorabversion kennzeichnen"
        required: true
        type: boolean
        default: true
  pull_request:
    paths:
      - "dist/streamiov-studio-app/**"
      - "scripts/sync-studio-ui.py"
      - "scripts/sync-studio-games.py"
      - "scripts/test-studio-media-pipeline.cjs"
      - "scripts/prepare-ffmpeg-runtime.py"
      - ".github/workflows/studio-build.yml"
  push:
    branches:
      - main
      - streamiov-build-setup-clean
    paths:
      - "dist/streamiov-studio-app/**"
      - "scripts/sync-studio-ui.py"
      - "scripts/sync-studio-games.py"
      - "scripts/test-studio-media-pipeline.cjs"
      - "scripts/prepare-ffmpeg-runtime.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FFMPEG_RELEASE_TAG: autobuild-2026-11-22-12-36
  FFMPEG_SOURCE_COMMIT: 359c825152
  FFMPEG_BUILD_SCRIPTS_COMMIT: 7f2a6b1050d302144de8366afa37a75e46f326aa

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            command: dist:win
            ffmpeg_target: win64
            ffmpeg_asset: ffmpeg-N-129219-g359c825152-win64-gpl.zip
            ffmpeg_sha256: af969e0dda60550d75a393a575bad7be6ca7be8e698baa1c80f4963250acc969
          - name: Windows ARM64
            runner: windows-latest
            command: dist:win:arm64
            ffmpeg_target: winarm64
            ffmpeg_asset: ffmpeg-N-129219-g359c825152-winarm64-gpl.zip
            ffmpeg_sha256: 94c08d75532f5b450f8562871452a863ffeaba66659b740eec85aadf4b6148c4
          - name: Linux x64
            runner: ubuntu-latest
            command: dist:linux
            ffmpeg_target: linux64
            ffmpeg_asset: ffmpeg-N-129219-g359c825152-linux64-gpl.tar.xz
            ffmpeg_sha256: bcc1539edf917320fd3eb83bd5ab4d0a5ff686980d4717e802e346279beb1f30
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            command: dist:linux:arm64
            ffmpeg_target: linuxarm64
            ffmpeg_asset: ffmpeg-N-129219-g359c825152-linuxarm64-gpl.tar.xz
            ffmpeg_sha256: 84ebc321674db39637175861ccfaf840b953bda2f115d7de77dddf155a2f11f6
          - name: ChromeOS ARM64 (Crostini)
            runner: ubuntu-24.04-arm
            command: dist:chromeos:arm64
            ffmpeg_target: linuxarm64
            ffmpeg_asset: ffmpeg-N-129219-g359c825152-linuxarm64-gpl.tar.xz
            ffmpeg_sha256: 84ebc321674db39637175861ccfaf840b953bda2f115d7de77dddf155a2f11f6
          - name: ChromeOS x64 (Crostini)
            runner: ubuntu-latest
            command: dist:chromeos:x64
            ffmpeg_target: linux64
            ffmpeg_asset: ffmpeg-N-129219-g359c825152-linux64-gpl.tar.xz
            ffmpeg_sha256: bcc1539edf917320fd3eb83bd5ab4d0a5ff686980d4717e802e346279beb1f30

    defaults:
      run:
        working-directory: dist/streamiov-studio-app

    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dist/streamiov-studio-app/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: FFmpeg-Laufzeit laden und prüfen
        run: >-
          python ../../scripts/prepare-ffmpeg-runtime.py
          --asset "${{ matrix.ffmpeg_asset }}"
          --sha256 "${{ matrix.ffmpeg_sha256 }}"
          --tag "${{ env.FFMPEG_RELEASE_TAG }}"
          --source-commit "${{ env.FFMPEG_SOURCE_COMMIT }}"
          --build-scripts-commit "${{ env.FFMPEG_BUILD_SCRIPTS_COMMIT }}"
          --target "${{ matrix.ffmpeg_target }}"

      - name: Eigene Regie-Engine testen
        run: npm run test:engine

      - name: Studio bauen
        run: npm run ${{ matrix.command }}

      - name: Installer als Artefakte speichern
        uses: actions/upload-artifact@v4
        with:
          name: streamiov-studio-${{ matrix.name }}
          path: dist/streamiov-studio-app/release/*
          if-no-files-found: error
          retention-days: 30

  media-pipeline-smoke:
    name: Synthetic audio/video pipeline smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: GStreamer installieren
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y gstreamer1.0-tools gstreamer1.0-plugins-good
      - name: Synthetische Audio-/Video-Encoding-Pipeline testen
        timeout-minutes: 5
        run: node scripts/test-studio-media-pipeline.cjs

  publish-release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    name: Installer dauerhaft veröffentlichen
    needs: [build, media-pipeline-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Installer aller Plattformen herunterladen
        uses: actions/download-artifact@v4
        with:
          pattern: streamiov-*
          path: artifacts

      - name: Determine and validate release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "require('./dist/streamiov-studio-app/package.json').version")
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_VERSION" != "$APP_VERSION" ]]; then
            echo "::error::package.json version $APP_VERSION does not match release input $REQUESTED_VERSION"
            exit 1
          fi
          if gh release view "studio-v$APP_VERSION" >/dev/null 2>&1; then
            echo "::error::Release studio-v$APP_VERSION already exists. Bump the app version before publishing new installers."
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: GPL-Quellcode-Nachweis für FFmpeg prüfen
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="artifacts/streamiov-ffmpeg-source-code"
          test -s "$SOURCE_DIR/ffmpeg-source-bundle.tar.xz" || {
            echo "::error::FFmpeg binaries are GPLv3. A complete corresponding-source bundle must be attached before redistribution."
            exit 1
          }
          test -s "$SOURCE_DIR/SHA256SUMS.txt"
          echo "Corresponding-source bundle present; continuing release validation."

      - name: Installer eindeutig benennen und prüfen
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "require('./dist/streamiov-studio-app/package.json').version")
          if [ "$APP_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::package.json version $APP_VERSION does not match release input $RELEASE_VERSION"
            exit 1
          fi
          mkdir -p release
          copy_one() {
            local directory="$1" pattern="$2" destination="$3"
            local source
            source=$(find "$directory" -maxdepth 1 -type f -name "$pattern" | head -n 1)
            if [ -z "$source" ]; then
              echo "::error::missing $pattern in $directory"
              exit 1
            fi
            cp "$source" "release/$destination"
          }
          copy_one "artifacts/streamiov-studio-Windows x64" "*.exe" "Streamiov.Studio.Setup.${APP_VERSION}-x64.exe"
          copy_one "artifacts/streamiov-studio-Windows ARM64" "*.exe" "Streamiov.Studio.Setup.${APP_VERSION}-arm64.exe"
          copy_one "artifacts/streamiov-studio-Linux x64" "*.AppImage" "Streamiov.Studio-${APP_VERSION}-x64.AppImage"
          copy_one "artifacts/streamiov-studio-Linux ARM64" "*.AppImage" "Streamiov.Studio-${APP_VERSION}-arm64.AppImage"
          copy_one "artifacts/streamiov-studio-Linux x64" "*.deb" "streamiov-studio_${APP_VERSION}_amd64.deb"
          copy_one "artifacts/streamiov-studio-Linux ARM64" "*.deb" "streamiov-studio_${APP_VERSION}_arm64.deb"
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          ls -lh

      - name: GitHub Release erstellen oder aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-v${{ steps.version.outputs.version }}
          name: Streamiov Studio ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: docs/RELEASE_NOTES.md
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          make_latest: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: release/*
