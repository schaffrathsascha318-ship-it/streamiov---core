name: Phase 1 agent tests
on:
  pull_request:
    paths:
      - "ai/**"
      - "tests/test_phase1_agent.py"
      - ".github/workflows/phase-1-agent-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run Phase 1 unit tests
        run: python -m unittest discover -s tests -v
