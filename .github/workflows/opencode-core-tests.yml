name: OpenCode Core tests

on:
  push:
    branches:
      - feat/opencode-core-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run complete Python test suite
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Install wheel and smoke-test CLI
        run: |
          python -m venv /tmp/opencode-core-package-check
          /tmp/opencode-core-package-check/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/opencode-core-package-check/bin/opencode-core --help
