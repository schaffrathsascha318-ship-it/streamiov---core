name: Streamiov full repository verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamiov-full-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bubblewrap for sandboxed specialist tests
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Run complete Python test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  node-and-release-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Cloudflare AI Worker contract
        run: node --test tests/test_cloudflare_ai_worker.mjs
      - name: Verify Cloudflare configuration
        run: python3 scripts/verify-cloudflare-config.py
      - name: Verify published release signatures
        run: node scripts/release-signing.mjs verify-release
