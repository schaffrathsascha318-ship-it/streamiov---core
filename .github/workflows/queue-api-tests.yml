name: Authenticated queue API tests

on:
  push:
    branches:
      - feat/opencode-authenticated-queue-api

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run complete Python test suite
        run: python -m unittest discover -s tests -v
