name: STREAMIOV autonomous development runner

on:
  schedule:
    - cron: "*/15 * * * *"
  issues:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: streamiov-autonomous-development
  cancel-in-progress: false

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  agent:
    if: github.event_name != 'issues' || github.event.label.name == 'agent-ready'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted default-branch code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Select an approved issue or the continuous platform mission
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create agent-ready --color 5319E7 --description "Eligible for autonomous STREAMIOV development" --force >/dev/null
          gh label create agent-in-progress --color 1D76DB --description "Being processed by the persistent STREAMIOV AI Chief" --force >/dev/null
          gh label create agent-review --color 0E8A16 --description "AI Chief prepared a draft pull request for review" --force >/dev/null
          gh label create agent-blocked --color B60205 --description "AI Chief is blocked and needs investigation" --force >/dev/null

          issue_json="$(gh issue list --state open --label agent-in-progress --limit 1 --json number,title,body)"
          if [[ "$(jq 'length' <<< "$issue_json")" -eq 0 ]]; then
            issue_json="$(gh issue list --state open --label agent-ready --limit 1 --json number,title,body)"
          fi

          if [[ "$(jq 'length' <<< "$issue_json")" -eq 0 ]]; then
            issue_number=0
            issue_title="STREAMIOV continuous platform development"
            issue_body="Continue building and verifying the complete Streamiov platform. First make the AI Chief Developer and its eleven distinct specialist workstreams reliable; then advance Core, Studio, own infrastructure, AI platform, games, gifts, creator tools, and all remaining roadmap areas. Continuously identify and implement valuable missing capabilities, reliability improvements, security fixes, tests, documentation, and infrastructure work without waiting for a separate feature request. Maintain an evidence-backed prioritized backlog and continue with the highest-value unblocked work. After independent verification and all required repository checks pass, integrate completed changes automatically. Never expose secrets, weaken central permission enforcement, bypass required checks, or change identity/OAuth boundaries."
            issue_json="$(jq -cn --arg title "$issue_title" --arg body "$issue_body" '{number:0,title:$title,body:$body}')"
          else
            issue_number="$(jq -r '.[0].number' <<< "$issue_json")"
            issue_author_association="$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number" --jq '.author_association')"
            case "$issue_author_association" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *)
                gh issue edit "$issue_number" --remove-label agent-ready --add-label agent-blocked
                gh issue comment "$issue_number" --body "Autonomous execution is limited to issues submitted by repository owners, members, or collaborators. This issue was not executed."
                echo "Issue author is not an authorized repository collaborator; skipping execution."
                exit 0
                ;;
            esac
            gh issue edit "$issue_number" --remove-label agent-ready --add-label agent-in-progress
            issue_title="$(jq -r '.[0].title' <<< "$issue_json")"
          fi

          issue_b64="$(jq -r '.[0] | @base64' <<< "$issue_json")"
          {
            echo "issue_number=$issue_number"
            echo "issue_title=$issue_title"
            echo "issue_b64=$issue_b64"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the persistent development branch
        if: steps.pick.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/streamiov-continuous-mission"
          gh auth setup-git
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            git switch --track -c "$branch" "origin/$branch"
            git merge --no-edit origin/main
          else
            git switch -c "$branch"
          fi

      - name: Restore durable AI Chief mission state
        if: steps.pick.outputs.issue_number != ''
        run: mkdir -p "${{ runner.temp }}/streamiov-ai-missions"

      - name: Restore previous mission database
        if: steps.pick.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STREAMIOV_AI_WORKER_TOKEN: ${{ secrets.STREAMIOV_AI_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/streamiov-ai-missions"
          artifact_name="streamiov-ai-missions-${{ steps.pick.outputs.issue_number }}"
          run_ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/autonomous-development.yml/runs?per_page=30" --jq '.workflow_runs[].id')"
          restored=false
          while IFS= read -r previous_run; do
            [[ -z "$previous_run" || "$previous_run" == "$GITHUB_RUN_ID" ]] && continue
            if gh run download "$previous_run" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$RUNNER_TEMP/streamiov-ai-missions" >/dev/null 2>&1; then
              if [[ ! -f "$RUNNER_TEMP/streamiov-ai-missions/mission-state.enc" ]]; then
                echo "::error::Mission artifact is missing its encrypted state envelope."
                exit 1
              fi
              node scripts/autonomous/mission-state-crypto.mjs decrypt \
                "$RUNNER_TEMP/streamiov-ai-missions/mission-state.enc" \
                "$RUNNER_TEMP/streamiov-ai-missions/missions.sqlite3"
              echo "Restored and authenticated encrypted mission state from workflow run $previous_run."
              restored=true
              break
            fi
          done <<< "$run_ids"
          if [[ "$restored" != true ]]; then
            echo "No prior mission artifact found; this mission will initialize or recover from its first checkpoint."
          fi

      - name: Verify Cloudflare AI gateway configuration
        if: steps.pick.outputs.issue_number != ''
        env:
          STREAMIOV_AI_WORKER_TOKEN: ${{ secrets.STREAMIOV_AI_WORKER_TOKEN }}
          STREAMIOV_MODEL_URL: ${{ vars.STREAMIOV_MODEL_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ${#STREAMIOV_AI_WORKER_TOKEN} -lt 32 || -z "$STREAMIOV_MODEL_URL" ]]; then
            echo "::error::Configure repository secret STREAMIOV_AI_WORKER_TOKEN and repository variable STREAMIOV_MODEL_URL. Values are never printed."
            exit 1
          fi

      - name: Run or resume the persistent AI Chief mission
        id: mission
        if: steps.pick.outputs.issue_number != ''
        env:
          STREAMIOV_AGENT_ISSUE_B64: ${{ steps.pick.outputs.issue_b64 }}
          STREAMIOV_MISSION_ID: ${{ steps.pick.outputs.issue_number == '0' && 'streamiov-platform' || format('streamiov-issue-{0}', steps.pick.outputs.issue_number) }}
          STREAMIOV_MISSION_DB: ${{ runner.temp }}/streamiov-ai-missions/missions.sqlite3
          STREAMIOV_AI_WORKER_TOKEN: ${{ secrets.STREAMIOV_AI_WORKER_TOKEN }}
          STREAMIOV_MODEL_URL: ${{ vars.STREAMIOV_MODEL_URL }}
          STREAMIOV_MODEL_PROVIDER: cloudflare-workers-ai
          RUNNER_TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --preserve-status --signal=INT --kill-after=90s 18m python scripts/autonomous/run_issue.py

      - name: Checkpoint and encrypt durable AI Chief mission state
        if: always() && steps.pick.outputs.issue_number != '' && steps.mission.outcome != 'skipped'
        env:
          STREAMIOV_AI_WORKER_TOKEN: ${{ secrets.STREAMIOV_AI_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          database="$RUNNER_TEMP/streamiov-ai-missions/missions.sqlite3"
          if [[ ! -f "$database" ]]; then
            echo "No mission database was created in this runner slice."
            exit 0
          fi
          python - "$database" <<'PY'
          import os
          import sqlite3
          import sys

          database = sys.argv[1]
          connection = sqlite3.connect(database)
          result = connection.execute("PRAGMA wal_checkpoint(TRUNCATE)").fetchone()
          connection.close()
          if result is None or result[0] != 0:
              raise SystemExit("Mission database WAL checkpoint did not complete cleanly.")
          wal = database + "-wal"
          if os.path.exists(wal) and os.path.getsize(wal) > 0:
              raise SystemExit("Mission database still has uncheckpointed WAL data.")
          for suffix in ("-wal", "-shm"):
              path = database + suffix
              if os.path.exists(path):
                  os.unlink(path)
          PY
          node scripts/autonomous/mission-state-crypto.mjs encrypt \
            "$database" "$RUNNER_TEMP/streamiov-ai-missions/mission-state.enc"

      - name: Save durable AI Chief mission state
        if: always() && steps.pick.outputs.issue_number != '' && steps.mission.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: streamiov-ai-missions-${{ steps.pick.outputs.issue_number }}
          path: ${{ runner.temp }}/streamiov-ai-missions/mission-state.enc
          if-no-files-found: warn
          retention-days: 90

      - name: Validate the complete project diff and run acceptance tests
        id: validation
        if: always() && steps.pick.outputs.issue_number != ''
        continue-on-error: true
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t changed < <({ git diff HEAD --name-only; git ls-files --others --exclude-standard; } | sort -u)
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "safe_changes=false" >> "$GITHUB_OUTPUT"
            echo "tests_passed=false" >> "$GITHUB_OUTPUT"
            echo "No source changes in this execution slice; mission state was saved."
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          for path in "${changed[@]}"; do
            lower="${path,,}"
            case "$lower" in
              .github/*|scripts/autonomous/*|scripts/ai/*|.git/*|*/.git/*|.wrangler/*|*/.wrangler/*|node_modules/*|*/node_modules/*|__pycache__/*|*/__pycache__/*|.ssh/*|*/.ssh/*|ai/__main__.py|ai/runtime/project_tools.py|ai/security/*|ai/*permissions*|ai/runtime/*permissions*|*wrangler.jsonc|*wrangler.toml|*.pem|*.key|*.p12|*.pfx|.env*|*/.env*|*secret*|*credential*|*oauth*|*access-token*|*refresh-token*)
                echo "::error::Protected control-plane or sensitive path changed: $path"
                exit 1
                ;;
            esac
            if [[ -L "$path" ]]; then
              echo "::error::Symlink changes are not accepted: $path"
              exit 1
            fi
          done
          if [[ -n "$(git diff HEAD --diff-filter=D --name-only)" ]]; then
            echo "::error::Autonomous deletion is not permitted."
            exit 1
          fi
          echo "safe_changes=true" >> "$GITHUB_OUTPUT"
          if ! git diff --check; then
            echo "tests_passed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python -m compileall -q ai
          compile_status=$?
          timeout --signal=INT --kill-after=30s 15m python -m unittest discover -s tests -v
          test_status=$?
          timeout --signal=INT --kill-after=15s 3m node --test tests/test_cloudflare_ai_worker.mjs
          node_status=$?
          set -e
          if [[ $compile_status -eq 0 && $test_status -eq 0 && $node_status -eq 0 ]]; then
            echo "tests_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "tests_passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Acceptance checks failed. The source diff will be preserved on the draft branch for the AI Chief's next repair cycle."
          fi

      - name: Preserve the development checkpoint and update its draft pull request
        if: always() && steps.pick.outputs.issue_number != '' && steps.validation.outputs.safe_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.pick.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.pick.outputs.issue_title }}
          TESTS_PASSED: ${{ steps.validation.outputs.tests_passed }}
          MISSION_STATUS: ${{ steps.mission.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/streamiov-continuous-mission"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "agent: checkpoint STREAMIOV AI Chief mission"
            git push origin "$branch"
          fi

          pr_number="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create --draft --base main --head "$branch" \
              --title "STREAMIOV AI Chief – continuous development" \
              --body "## Persistent autonomous development checkpoint

          - Mission: ${MISSION_STATUS:-active}
          - Triggered by: ${ISSUE_NUMBER}
          - Independent acceptance checks: ${TESTS_PASSED:-not completed}
          - Eleven specialist workstreams share distinct responsibilities and coordinate through the persistent mission planner.
          - The mission database and per-agent checkpoints are resumed between execution slices.
          - Changes are preserved on the continuous development branch.
          - Completed work is eligible for automatic integration only after independent acceptance checks and all required GitHub checks pass.

          Production deployment is handled by the repository's trusted deployment pipeline. Secrets, identity/OAuth boundaries, central permission enforcement, and paid-resource activation are not self-modifiable."
          else
            gh pr edit "$pr_number" --title "STREAMIOV AI Chief – continuous development" \
              --body "## Persistent autonomous development checkpoint

          - Mission: ${MISSION_STATUS:-active}
          - Latest request: ${ISSUE_TITLE}
          - Independent acceptance checks: ${TESTS_PASSED:-not completed}
          - Eleven specialist workstreams share distinct responsibilities and coordinate through the persistent mission planner.
          - The mission database and per-agent checkpoints are resumed between execution slices.
          - Changes are preserved on the continuous development branch.
          - Completed work is eligible for automatic integration only after independent acceptance checks and all required GitHub checks pass.

          Production deployment is handled by the repository's trusted deployment pipeline. Secrets, identity/OAuth boundaries, central permission enforcement, and paid-resource activation are not self-modifiable."
          fi

          if [[ -z "$pr_number" ]]; then
            pr_number="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          fi

          if [[ -n "$pr_number" ]]; then
            # GITHUB_TOKEN pushes do not trigger other workflows. Dispatch the
            # trusted checks explicitly against the saved branch before merging.
            if ! gh workflow run phase-1-agent-tests.yml --ref "$branch"; then
              echo "::warning::Could not dispatch Phase 1 agent tests."
            fi
            if ! gh workflow run secret-scanning.yml --ref "$branch"; then
              echo "::warning::Could not dispatch secret scanning."
            fi
            app_version="$(node -p "require('./dist/streamiov-studio-app/package.json').version")"
            if ! gh workflow run studio-build.yml --ref "$branch" \
              -f publish_release=false -f release_version="$app_version" -f prerelease=false; then
              echo "::warning::Could not dispatch Studio platform builds."
            fi
          fi

          if [[ "$TESTS_PASSED" == "true" && "${MISSION_STATUS:-active}" == "completed" ]]; then
            if [[ -n "$pr_number" ]]; then
              gh pr ready "$pr_number" || true
              if timeout --preserve-status --signal=INT --kill-after=30s 15m gh pr checks "$pr_number" --watch --fail-fast; then
                checks_json="$(gh pr checks "$pr_number" --json name,state)"
                check_count="$(jq 'length' <<< "$checks_json")"
                if [[ "$check_count" -gt 0 ]] && jq -e 'all(.[]; .state == "SUCCESS")' <<< "$checks_json" >/dev/null; then
                  gh pr merge "$pr_number" --squash
                else
                  echo "::warning::No complete set of successful GitHub checks was reported; the pull request remains open."
                fi
              else
                echo "::warning::GitHub checks did not all pass within the wait window; the pull request remains open."
              fi
            fi
          fi

          if [[ "$ISSUE_NUMBER" != "0" ]]; then
            if [[ "$TESTS_PASSED" == "true" && "${MISSION_STATUS:-active}" == "completed" ]]; then
              gh issue edit "$ISSUE_NUMBER" --remove-label agent-in-progress --add-label agent-review
              gh issue comment "$ISSUE_NUMBER" --body "The AI Chief completed its mission and the independent acceptance checks passed. A draft pull request is available for owner review."
            elif [[ "$TESTS_PASSED" == "false" ]]; then
              gh issue comment "$ISSUE_NUMBER" --body "The AI Chief preserved its current development checkpoint. Acceptance checks still need repair; the draft PR records the current evidence."
            fi
          fi

      - name: Mark failed runner execution as blocked
        if: failure() && steps.pick.outputs.issue_number != '' && steps.pick.outputs.issue_number != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.pick.outputs.issue_number }}
        shell: bash
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label agent-in-progress --add-label agent-blocked || true
          gh issue comment "$ISSUE_NUMBER" --body "The autonomous runner stopped safely. No unverified change is integrated or deployed. Review the workflow log and resume the persistent mission after repairing the cause." || true
