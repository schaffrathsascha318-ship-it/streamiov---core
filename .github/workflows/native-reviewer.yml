name: Streamiov native independent review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: streamiov-native-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-review:
    name: Trusted native review (no AI provider)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted reviewer from PR base
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch PR commit without checking out or executing PR code
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          git cat-file -e "refs/remotes/pull/${PR_NUMBER}/head^{commit}"

      - name: Run the trusted base-revision reviewer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: refs/remotes/pull/${{ github.event.pull_request.number }}/head
        run: |
          set +e
          python -m ai.review.independent_reviewer \
            --root . \
            --base "$BASE_SHA" \
            --head "$HEAD_REF" \
            --json-out "$RUNNER_TEMP/streamiov-native-review.json"
          review_status=$?
          set -e
          if [ -f "$RUNNER_TEMP/streamiov-native-review.json" ]; then
            cat "$RUNNER_TEMP/streamiov-native-review.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$review_status"
