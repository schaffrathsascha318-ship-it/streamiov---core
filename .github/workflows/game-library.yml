name: STREAMIOV Game Library Checks

on:
  pull_request:
    paths:
      - "games/**"
      - ".github/workflows/game-library.yml"
  push:
    branches: [main, streamiov-build-setup-clean]
    paths:
      - "games/**"
      - ".github/workflows/game-library.yml"

permissions:
  contents: read

jobs:
  game-manifest-and-source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate independent game registry and Neon Relay source
        run: node --test games/tests/*.test.cjs
