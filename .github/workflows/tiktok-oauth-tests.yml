name: TikTok sandbox OAuth tests
on:
  pull_request:
    paths:
      - "core/integration/tiktok-oauth.js"
      - "tests/tiktok-oauth.test.js"
      - "config/platforms/tiktok/oauth.json"
      - "docs/integrations/tiktok-oauth.md"
      - ".github/workflows/tiktok-oauth-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oauth-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run sandbox-only OAuth tests
        run: node --test tests/tiktok-oauth.test.js
