name: Deploy Cloudflare (manual, owner-approved)

# Production deployment remains explicitly owner-approved.
# This workflow never deploys automatically on merge or push.
# It never creates accounts, provisions paid resources, or changes OAuth.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        type: choice
        default: homepage
        options:
          - homepage
          - ai-worker
          - both
      confirm:
        description: "I confirm this is an owner-approved deployment"
        required: true
        type: boolean
        default: false

concurrency:
  group: streamiov-cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: inputs.confirm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify configs before any deployment
        run: |
          bash -n scripts/deploy-streamiov-ai-worker.sh
          python scripts/verify-cloudflare-config.py
          node --test tests/test_cloudflare_ai_worker.mjs

  deploy-homepage:
    needs: verify
    if: needs.verify.result == 'success' && inputs.confirm && (inputs.target == 'homepage' || inputs.target == 'both')
    runs-on: ubuntu-24.04
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STREAMIOV_PRODUCTION_ROLLBACK_READY: ${{ vars.STREAMIOV_PRODUCTION_ROLLBACK_READY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require verified production rollback readiness
        run: |
          if [ "${STREAMIOV_PRODUCTION_ROLLBACK_READY:-}" != "true" ]; then
            echo "::error::Production deploy blocked. Verify and document a working rollback/recovery path, then set the production environment variable STREAMIOV_PRODUCTION_ROLLBACK_READY=true."
            exit 1
          fi

      - name: Require owner-provided Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "ABBRUCH: CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID müssen als GitHub-Environment-Secrets 'production' gesetzt sein." >&2
            exit 1
          fi

      - name: Deploy the public site to the streamiov Pages project
        run: >-
          npx --yes wrangler@4 pages deploy dist/streamiov-homepage-worker/public
          --project-name streamiov
          --branch main
          --commit-dirty=true

      - name: Record honest deployment boundary
        run: |
          echo "Wrangler accepted the Pages deployment command."
          echo "This is not proof that every asset, cache entry, or a custom domain is live."
          echo "Verify https://streamiov.pages.dev/ and /download/ after propagation."
          echo "The assets-only Worker config remains an alternative deployment target and is not used by this job."

  deploy-ai-worker:
    needs: verify
    if: needs.verify.result == 'success' && inputs.confirm && (inputs.target == 'ai-worker' || inputs.target == 'both')
    runs-on: ubuntu-24.04
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require verified production rollback readiness
        run: |
          if [ "${STREAMIOV_PRODUCTION_ROLLBACK_READY:-}" != "true" ]; then
            echo "::error::Production deploy blocked. Verify and document a working rollback/recovery path, then set the production environment variable STREAMIOV_PRODUCTION_ROLLBACK_READY=true."
            exit 1
          fi

      - name: Require owner-provided Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "ABBRUCH: CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID müssen als GitHub-Environment-Secrets 'production' gesetzt sein." >&2
            exit 1
          fi

      - name: Deploy AI Worker source
        run: npx --yes wrangler@4 deploy --config infrastructure/cloudflare/streamiov-ai-worker/wrangler.jsonc

      - name: Verify the bearer secret is present
        run: |
          set +e
          OUTPUT="$(npx --yes wrangler@4 secret list --config infrastructure/cloudflare/streamiov-ai-worker/wrangler.jsonc 2>&1)"
          STATUS=$?
          printf '%s\n' "$OUTPUT"
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "ABBRUCH: Secret-Liste konnte nicht gelesen werden. Cloudflare-Token-Rechte prüfen." >&2
            exit 1
          fi
          if ! printf '%s' "$OUTPUT" | grep -q "STREAMIOV_AI_WORKER_TOKEN"; then
            echo "ABBRUCH: STREAMIOV_AI_WORKER_TOKEN fehlt. Einmalig setzen:" >&2
            echo "  npx wrangler@4 secret put STREAMIOV_AI_WORKER_TOKEN --config infrastructure/cloudflare/streamiov-ai-worker/wrangler.jsonc" >&2
            exit 1
          fi

      - name: Record honest deployment boundary
        run: |
          echo "The Worker source was deployed and the bearer secret exists."
          echo "This does not prove Workers AI quota, model availability, or a successful inference."
          echo "Run 'python -m ai --doctor' with the deployed URL and token before calling it ready."
