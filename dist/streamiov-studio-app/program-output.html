<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STREAMIOV · Programmausgabe</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#05060d;color:#fff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{display:grid;place-items:center;background:#05060d}
main{width:100%;height:100%;display:grid;grid-template-rows:1fr auto;gap:10px;padding:14px}
canvas{width:100%;height:100%;object-fit:contain;background:#090d13;border:1px solid #263747}
.meta{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:0 4px;font-size:14px;letter-spacing:.18em}
#scene{color:#edf6fb;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#state{color:#8b91ad;font-weight:700;text-align:right}
</style>
</head>
<body>
<main>
<canvas id="program" width="1280" height="720" aria-label="Lokale Programmvorschau"></canvas>
<div class="meta"><span id="scene">STARTING SOON</span><span id="state">LOKALE CANVAS · NOCH KEIN LIVE-VIDEO</span></div>
</main>
<script>
(() => {
'use strict';
const canvas=document.getElementById('program');
const context=canvas.getContext('2d');
const sceneLabel=document.getElementById('scene');
const width=canvas.width;
const height=canvas.height;
 const types=new Set(['title','text','camera','screen','window','image','video','audio','color']);
 let current={name:'STARTING SOON',background:'#090d13',sources:[]};
 let assets=[];
  let frameImage=null;
  let frameSequence=0;


const number=(value,min,max,fallback)=>{
 const parsed=Number(value);
 return Number.isFinite(parsed)?Math.max(min,Math.min(max,parsed)):fallback;
};
const text=(value,max)=>typeof value==='string'?value.slice(0,max):'';
const color=(value,fallback)=>/^#[0-9a-fA-F]{6}$/.test(value||'')?value:fallback;
function sanitize(value){
 const raw=value&&typeof value==='object'?value:{};
 const sources=Array.isArray(raw.sources)?raw.sources.slice(0,20):[];
 return {
  name:text(raw.name,60)||'STREAMIOV',
  background:color(raw.background,'#090d13'),
  sources:sources.filter(source=>source&&types.has(source.type)).map((source,index)=>({
   type:source.type,
   name:text(source.name,60),
   text:text(source.text,200),
   x:number(source.x,0,0.95,0),
   y:number(source.y,0,0.95,0),
   w:number(source.w,0.05,1,1),
   h:number(source.h,0.05,1,1),
   z:Math.trunc(number(source.z,0,100,index)),
   visible:source.visible!==false,
   settings:source.settings&&typeof source.settings==='object'?{
    color:color(source.settings.color,'#ffffff'),
    assetId:text(source.settings.assetId,512)
   }:{}
  }))
 };
}
function wrapped(value,x,y,w,h,size,fill){
 context.fillStyle=fill;context.textAlign='center';context.textBaseline='middle';
 context.font='900 '+size+'px system-ui';
 const words=text(value,200).split(/\s+/).filter(Boolean);
 const lines=[];
 let line='';
 for(const word of words){
  const next=line?line+' '+word:word;
  if(context.measureText(next).width>w*0.9&&line){lines.push(line);line=word;}
  else line=next;
 }
 if(line)lines.push(line);
 const lineHeight=size*1.15;
 const start=y+h/2-(lines.length-1)*lineHeight/2;
 lines.forEach((item,index)=>context.fillText(item,x+w/2,start+index*lineHeight));
}
function placeholder(x,y,w,h,label){
 context.fillStyle='#0c131b';context.fillRect(x,y,w,h);
 context.strokeStyle='#263747';context.lineWidth=2;context.strokeRect(x+1,y+1,w-2,h-2);
 context.fillStyle='#8195a6';context.textAlign='center';context.textBaseline='middle';
 context.font='600 '+Math.max(12,Math.round(w*0.028))+'px system-ui';
 context.fillText(label,x+w/2,y+h/2);
}
function render(){
 const scene=sanitize(current);
 sceneLabel.textContent=scene.name;
  context.clearRect(0,0,width,height);
  context.fillStyle=scene.background;context.fillRect(0,0,width,height);
  if(frameImage&&frameImage.complete&&frameImage.naturalWidth){
   context.drawImage(frameImage,0,0,width,height);
   return;
  }
  for(const source of [...scene.sources].sort((a,b)=>a.z-b.z)){
   if(!source.visible)continue;
   const x=source.x*width,y=source.y*height,w=source.w*width,h=source.h*height;
   if(source.type==='color'){
    context.fillStyle=source.settings.color;context.fillRect(x,y,w,h);
    continue;
   }
   if(['camera','screen','window','image','video','audio'].includes(source.type)){
    placeholder(x,y,w,h,source.type==='camera'?'Kamera nicht aktiv':source.type==='screen'?'Bildschirm nicht geteilt':source.type==='window'?'Fenster nicht geteilt':source.type==='audio'?'Audioquelle aktiv':'Medienquelle im Regie-Canvas');
    continue;
   }
   if(source.type==='title'){

   const gradient=context.createLinearGradient(x,y,x+w,y+h);
   gradient.addColorStop(0,'#182a39');gradient.addColorStop(.6,'#10151e');gradient.addColorStop(1,'#292044');
   context.fillStyle=gradient;context.fillRect(x,y,w,h);
  }else{
   context.fillStyle='rgba(10,16,24,0.86)';context.fillRect(x,y,w,h);
  }
  const size=source.type==='title'
   ?Math.max(18,Math.min(96,Math.round(w*0.085)))
   :Math.max(14,Math.min(48,Math.round(w*0.04)));
  wrapped(source.text||source.name,x,y,w,h,size,'#edf6fb');
  if(source.type==='title'){
   context.fillStyle='#35e0d0';context.textAlign='center';context.textBaseline='middle';
   context.font='700 '+Math.max(12,Math.round(w*0.022))+'px system-ui';
   context.fillText('STREAMIOV',x+w/2,y+h/2+size*1.2);
  }
 }
 context.fillStyle='rgba(53,224,208,0.8)';context.textAlign='left';context.textBaseline='bottom';
 context.font='700 15px system-ui';
 context.fillText('STREAMIOV · LOKALE CANVAS',width*0.02,height*0.98);
}
window.streamiovProgramOutput?.onScene((value)=>{
 current=sanitize(value);
 render();
});
window.streamiovProgramOutput?.onAssets((value)=>{
 assets=Array.isArray(value?.assets)?value.assets:[];
});
function acceptFrameImage(image,sequence){
  if(sequence!==frameSequence){if(typeof image.close==='function')image.close();return;}
  if(frameImage&&typeof frameImage.close==='function')frameImage.close();
  frameImage=image;
  document.getElementById('state').textContent='REGIE-CANVAS · LOKALE AUSGABE';
  render();
}
async function decodeProgramFrame(frame){
  const sequence=++frameSequence;
  if(typeof frame==='string'){
   if(!frame.startsWith('data:image/jpeg;base64,'))return;
   const image=new Image();
   image.onload=()=>acceptFrameImage(image,sequence);
   image.onerror=()=>{frameImage=null;};
   image.src=frame;
   return;
  }
  if(!(frame instanceof Uint8Array)&&!(frame instanceof ArrayBuffer))return;
  const bytes=frame instanceof Uint8Array?frame:new Uint8Array(frame);
  if(bytes.length<4||bytes[0]!==0xff||bytes[1]!==0xd8||bytes[2]!==0xff)return;
  const blob=new Blob([bytes],{type:'image/jpeg'});
  if(typeof createImageBitmap==='function'){
   try{acceptFrameImage(await createImageBitmap(blob),sequence);}catch(_){if(sequence===frameSequence)frameImage=null;}
   return;
  }
  const url=URL.createObjectURL(blob);
  const image=new Image();
  image.onload=()=>{URL.revokeObjectURL(url);acceptFrameImage(image,sequence);};
  image.onerror=()=>{URL.revokeObjectURL(url);frameImage=null;};
  image.src=url;
}
window.streamiovProgramOutput?.onFrame((frame)=>{void decodeProgramFrame(frame);});

render();
})();
</script>
</body>
</html>
