<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Streamiov Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#f5f7fb;font-family:system-ui,sans-serif}
header{height:64px;padding:0 18px;border-bottom:1px solid #263044;
display:flex;align-items:center;justify-content:space-between}
.logo{font-size:24px;font-weight:800}
.status{padding:7px 12px;border-radius:8px;background:#18202d}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px}
.preview{position:relative;background:#000;border:1px solid #293349;
border-radius:12px;overflow:hidden;aspect-ratio:16/9}
#video{width:100%;height:100%;object-fit:contain}
.placeholder{position:absolute;inset:0;display:grid;place-items:center;
color:#8995a8;text-align:center}
.panel{background:#101620;border:1px solid #293349;border-radius:12px;padding:16px}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.grid{display:grid;gap:11px}
label{font-size:13px;color:#aeb8c8}
select,input,button{width:100%;padding:10px;border-radius:8px;
border:1px solid #354057;background:#171f2c;color:#fff}
button{cursor:pointer}
.live{background:#b51f36}
h2{margin-top:0}
@media(max-width:850px){
main{grid-template-columns:1fr}
.controls{grid-template-columns:1fr}
}
</style>
</head>

<body>
<header>
  <div class="logo">Streamiov Studio</div>
  <div id="status" class="status">OFFLINE</div>
</header>

<main>
<section>
  <div class="preview">
    <video id="video" autoplay muted playsinline></video>
    <div id="placeholder" class="placeholder">
      <div>
        <strong>Streamiov Stream-Vorschau</strong><br>
        Kamera kann hier angezeigt werden.
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="camera">Kamera</button>
    <button id="microphone">Mikrofon</button>
    <button id="live" class="live">LIVE STARTEN</button>
  </div>
</section>

<aside class="panel">
<h2>Stream-Einstellungen</h2>

<div class="grid">
<label>Auflösung
<select id="resolution">
<option>720p</option>
<option selected>1080p</option>
<option>1440p</option>
</select>
</label>

<label>FPS
<select id="fps">
<option>30</option>
<option selected>60</option>
</select>
</label>

<label>Bitrate
<input id="bitrate" type="number" value="4500" min="500">
</label>

<label>Plattform
<select id="platform">
<option>Streamiov</option>
<option>YouTube</option>
<option>Twitch</option>
<option>TikTok</option>
<option>Kick</option>
<option>Facebook</option>
</select>
</label>

<label>Layout
<select id="layout">
<option>Streamiov Standard</option>
<option>Kamera + Chat</option>
<option>Gameplay</option>
<option>Full Screen</option>
</select>
</label>

<label>Overlay
<select id="overlay">
<option>Streamiov Standard</option>
<option>Eigenes Overlay</option>
<option>Kein Overlay</option>
</select>
</label>

<label>Audio
<select id="audio">
<option>Mikrofon + System</option>
<option>Nur Mikrofon</option>
<option>Nur System</option>
</select>
</label>
</div>
</aside>
</main>

<script>
let mediaStream=null;
let live=false;

const video=document.getElementById("video");
const placeholder=document.getElementById("placeholder");
const status=document.getElementById("status");

document.getElementById("camera").onclick=async()=>{
  try{
    const cam=await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:false
    });

    if(!mediaStream) mediaStream=new MediaStream();

    cam.getVideoTracks().forEach(track=>{
      mediaStream.addTrack(track);
    });

    video.srcObject=mediaStream;
    placeholder.style.display="none";
    status.textContent="KAMERA BEREIT";
  }catch(e){
    status.textContent="KAMERA NICHT VERFÜGBAR";
  }
};

document.getElementById("microphone").onclick=async()=>{
  try{
    const mic=await navigator.mediaDevices.getUserMedia({
      video:false,
      audio:true
    });

    if(!mediaStream) mediaStream=new MediaStream();

    mic.getAudioTracks().forEach(track=>{
      mediaStream.addTrack(track);
    });

    video.srcObject=mediaStream;
    status.textContent="AUDIO BEREIT";
  }catch(e){
    status.textContent="MIKROFON NICHT VERFÜGBAR";
  }
};

document.getElementById("live").onclick=()=>{
  live=!live;
  status.textContent=live?"LIVE":"OFFLINE";
  document.getElementById("live").textContent=
    live?"LIVE STOPPEN":"LIVE STARTEN";
};
</script>
</body>
</html>
